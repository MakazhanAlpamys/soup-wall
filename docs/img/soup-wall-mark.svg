      <stop stop-color="#254633"/>
      <stop offset="1" stop-color="#17271d"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffd18a"/>
      <stop offset="1" stop-color="#efa94f"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#shell)" stroke="#54735b" stroke-width="2"/>
  <g fill="none" stroke="#f7c576" stroke-linecap="round" stroke-width="7">
    <path d="M42 29c-9 11 9 13 0 24"/>
    <path d="M65 25c-9 11 9 13 0 24"/>
    <path d="M88 29c-9 11 9 13 0 24"/>
  </g>
