    "dep:x25519-dalek",
    "dep:hkdf",
    "dep:pbkdf2",
    "dep:signature",
    "dep:rand",
    "dep:crypto-bigint",
    "dep:crypto-primes",
    "dep:md-5",
    "dep:ripemd",
    "dep:des",
    "dep:ml-dsa",
    "dep:slh-dsa",
    "dep:ml-kem",
    "dep:pkcs8-pq",
    "dep:getrandom",
    "dep:generic-array",
]
tls-aws-lc = [
    "dep:rustls",
    "dep:aws-lc-rs",
    "rustls/aws_lc_rs",
]
