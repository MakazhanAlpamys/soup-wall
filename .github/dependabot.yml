# Keep Rust, Actions, and gateway container dependencies current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Both of these were opened, reviewed and declined on 2026-09-10 for a
      # reason that a re-opened pull request would not carry. Patch and minor
      # updates still come through; only the major bump is held.
      #
      # sha2 0.11 moves to the next RustCrypto generation (digest 0.11,
      # hybrid-array), so it cannot land alone: hmac and aes-gcm have to move
      # with it, and the output type stops implementing
      # LowerHex so every `format!("{:x}", ..)` over a digest breaks. There is
      # no known advisory requiring this major bump. Unblocks when the whole
      # RustCrypto stack has matching stable releases.
      - dependency-name: sha2
        update-types: ["version-update:semver-major"]
      # Same generation, same refusal, and the proof arrived on its own: hmac
      # 0.13 was proposed hours after sha2 0.11 was declined. Taking it alone
      # breaks the other way round -- Hmac<Sha256> needs sha2 and hmac from the
      # same digest generation, which is exactly why neither moves by itself.
      - dependency-name: hmac
        update-types: ["version-update:semver-major"]
      # agentfw and the gateway both declare axum. Move them together with
      # their route tests in a dedicated migration.
      - dependency-name: axum
        update-types: ["version-update:semver-major"]
      # rusqlite 0.40 removes FromSql/ToSql for u64 and usize. The gateway's
      # tenant store handles spend and rate-limit values; review each signed
      # conversion rather than allowing a broad automated cast.
      - dependency-name: rusqlite
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
