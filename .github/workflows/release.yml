# Build the agent, benchmark and Soup Wall Gateway from one verified tag.
# Publish platform archives, six SBOMs, checksums and a GHCR image.
#
# No third-party release action: `gh` is preinstalled on every runner and the
# token it uses is the one already scoped to this repository.

name: release

on:
  push:
    tags: ["v*"]
  # Re-runnable against a tag that is already pushed, so a single stuck runner
  # does not cost a re-tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.3.0)"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Validate tag and freeze its commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag must be a vX.Y.Z tag, optionally with a prerelease suffix" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$TAG"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      # The all-target lock still includes Windows' RustCrypto RSA provider.
      # XML-Enc decryption is disabled and tested on all release targets; see
      # docs/PROVENANCE.md. Issue #19 remains open. Other vulnerabilities block.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Pin the standard macOS 15 pools so release scheduling and toolchain
          # behavior do not change when GitHub advances the `latest` image.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Verify frozen release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Verify SAML on the archive's target
        run: cargo test --locked -p llm-firewall --lib --target ${{ matrix.target }} saml_auth::tests

      # The default feature set on purpose: the `ml` classifier needs model
      # assets the user fetches themselves, and shipping a binary that expects
      # them would break the single-command install the README promises.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentfw -p soup-wall-bench -p llm-firewall

      - name: Stage (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          d="soup-wall-${TAG}-${{ matrix.target }}"
          mkdir "$d"
          cp "target/${{ matrix.target }}/release/agentfw" "$d/"
          cp "target/${{ matrix.target }}/release/soup-wall-bench" "$d/"
          cp "target/${{ matrix.target }}/release/llm-firewall" "$d/"
          cp "target/${{ matrix.target }}/release/llm-firewall" "$d/soup-wall-gateway"
          cp firewall.yaml "$d/"
          cp -R policies "$d/"
          cp LICENSE NOTICE README.md "$d/"
          tar -czf "staging/$d.tar.gz" "$d"

      - name: Stage (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          d="soup-wall-${TAG}-${{ matrix.target }}"
          mkdir "$d"
          cp "target/${{ matrix.target }}/release/agentfw.exe" "$d/"
          cp "target/${{ matrix.target }}/release/soup-wall-bench.exe" "$d/"
          cp "target/${{ matrix.target }}/release/llm-firewall.exe" "$d/"
          cp "target/${{ matrix.target }}/release/llm-firewall.exe" "$d/soup-wall-gateway.exe"
          cp firewall.yaml "$d/"
          cp -R policies "$d/"
          cp LICENSE NOTICE README.md "$d/"
          7z a -tzip "staging/$d.zip" "$d" > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Verify frozen release commit
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: cargo cyclonedx --all --format json --all-features --target all
      - name: Confirm all six workspace packages have an SBOM
        shell: bash
        run: |
          set -euo pipefail
          for package in soup-wall-core soup-wall-agent agentfw soup-wall-adapter soup-wall-bench llm-firewall; do
            test "$(find . -name "$package.cdx.json" | wc -l)" -eq 1 || {
              echo "missing or duplicate SBOM for $package" >&2
              exit 1
            }
          done
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find . -name '*.cdx.json' -exec cp {} staging/ \;
          ls -la staging
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sbom
          path: staging/*
          if-no-files-found: error

  container:
    name: Publish GHCR image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Verify frozen release commit
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    needs: [verify, build, sbom, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Verify frozen release commit
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # One checksum file over everything published, generated where the files
      # are, so a reader can verify the whole release with a single command.
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Redirect first, glob second: `sha256sum * > SHA256SUMS` would list
          # the (already created, still empty) checksum file among its inputs.
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      # Upload into the release if one already exists for this tag -- the notes
      # for a security tool are written by a person, not generated from a commit
      # list -- and only fall back to creating one if the tag was pushed without
      # it. `--clobber` makes a re-run of this job idempotent.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" --generate-notes --verify-tag
          fi
