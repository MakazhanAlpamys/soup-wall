# CI for the complete open-source Soup Wall workspace.
# Every workspace member, including the gateway, is built from the same lock.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The optional ML stack is not compiled by the default-feature job.
  all-features:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  agent-windows-security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p agentfw --all-targets -- -D warnings
      - run: cargo test --locked -p agentfw

  saml-release-targets:
    name: SAML ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rsa: absent
          - os: macos-15
            target: aarch64-apple-darwin
            rsa: absent
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rsa: absent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rsa: present
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Verify target's resolved RSA dependency boundary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          EXPECT_RSA: ${{ matrix.rsa }}
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p llm-firewall --target "$RELEASE_TARGET" --edges normal --prefix none)"
          if grep -q '^rsa v' <<< "$graph"; then actual=present; else actual=absent; fi
          echo "rsa in $RELEASE_TARGET dependency graph: $actual"
          test "$actual" = "$EXPECT_RSA"
      - name: Verify signed SAML, tamper rejection, and disabled decryption
        run: cargo test --locked -p llm-firewall --lib --target ${{ matrix.target }} saml_auth::tests

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p llm-firewall redis_limits::tests::redis_shares_rate_and_spend_windows -- --ignored
        env:
          LLM_FW_TEST_REDIS_URL: redis://127.0.0.1:6379/15

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: firewall
          POSTGRES_USER: firewall
          POSTGRES_PASSWORD: firewall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firewall -d firewall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p llm-firewall tenant_store::tests::postgres_control_plane_persists_tenants_tokens_policies_and_audit -- --ignored
        env:
          LLM_FW_TEST_POSTGRES_URL: postgresql://firewall:firewall@127.0.0.1:5432/firewall?sslmode=disable

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: soup-wall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke gateway health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker run -d soup-wall:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if docker exec "$container" curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
