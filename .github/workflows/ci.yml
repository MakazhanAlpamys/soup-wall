# CI for the public Core repository.
#
# There is nothing to prune here: this repository never contains the
# commercial proxy. The lock guard below is kept as a regression tripwire so a
# dependency that only ever belonged to that layer cannot be reintroduced
# without the build saying so.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  # The `ml` stack is optional and off by default, so the `test` job above never
  # compiles it. That blind spot let a dependency bump go green while being
  # uncompilable: candle-transformers was raised to 0.11 while candle-core and
  # candle-nn stayed at 0.8, which puts two versions of `Tensor` in one graph.
  # Public runners are free and unmetered -- the private tree can only afford
  # this weekly, this repository can afford it on every push.
  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features --locked

  lock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No commercial-layer dependency may enter this tree
        run: |
          set -euo pipefail
          if grep -E '^name = "(saml-rs|rsa|tokio-postgres|deadpool-postgres|redis|jsonwebtoken)"' Cargo.lock; then
            echo "a dependency that belongs to the commercial layer entered Cargo.lock" >&2
            exit 1
          fi
          echo "lock is clean"
