# Advisory scan and six-crate SBOM for the complete open-source workspace.

name: supply-chain

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary: compiling cargo-audit from source costs several minutes
      # per run for a tool that does no compilation itself.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      # Windows saml-rs 0.5.3 pulls rsa 0.9.10; the lock includes every target.
      # Linux/macOS use AWS-LC and their resolved graphs do not include rsa.
      # Soup Wall never configures a decryption key; encrypted assertions fail
      # closed and a regression test protects that invariant. See
      # docs/PROVENANCE.md. Only this advisory is excepted; any other
      # vulnerability, including one affecting rustls, still fails this job.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      # Include the optional ML classifier and the gateway's SAML/DB stack.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json --all-features --target all
      - name: Confirm all six workspace packages have an SBOM
        shell: bash
        run: |
          set -euo pipefail
          for package in soup-wall-core soup-wall-agent agentfw soup-wall-adapter soup-wall-bench llm-firewall; do
            test "$(find . -name "$package.cdx.json" | wc -l)" -eq 1 || {
              echo "missing or duplicate SBOM for $package" >&2
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: soup-wall-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
          retention-days: 90
