name: Soup Wall PostgreSQL restore drill

on:
  workflow_dispatch:
    inputs:
      minimum_schema_version:
        description: "Minimum migration version accepted by the restore drill"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: soup-wall-staging-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Encrypted PostgreSQL restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client and age
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y age postgresql-client
      - name: Run isolated encrypted backup and restore
        shell: pwsh
        env:
          SOURCE_DATABASE_URL: ${{ secrets.LLM_FW_SOURCE_DATABASE_URL }}
          DRILL_DATABASE_URL: ${{ secrets.LLM_FW_DRILL_DATABASE_URL }}
          BACKUP_RECIPIENT: ${{ secrets.LLM_FW_BACKUP_RECIPIENT }}
          BACKUP_IDENTITY: ${{ secrets.LLM_FW_BACKUP_IDENTITY }}
          MINIMUM_SCHEMA_VERSION: ${{ inputs.minimum_schema_version }}
        run: |
          foreach ($name in @('SOURCE_DATABASE_URL', 'DRILL_DATABASE_URL', 'BACKUP_RECIPIENT', 'BACKUP_IDENTITY')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required staging secret $name is not configured."
            }
          }
          $schemaVersion = 0
          if (-not [int]::TryParse($env:MINIMUM_SCHEMA_VERSION, [ref]$schemaVersion) -or $schemaVersion -lt 1) {
            throw 'minimum_schema_version must be a positive integer.'
          }
          $identityPath = Join-Path $env:RUNNER_TEMP 'soup-wall-age-identity'
          $backupPath = Join-Path $env:RUNNER_TEMP 'soup-wall-control-plane.age'
          try {
            Set-Content -LiteralPath $identityPath -Value $env:BACKUP_IDENTITY -NoNewline -Encoding utf8
            & chmod 600 $identityPath
            & ./scripts/postgres-restore-drill.ps1 `
              -SourceDatabaseUrl $env:SOURCE_DATABASE_URL `
              -DrillDatabaseUrl $env:DRILL_DATABASE_URL `
              -BackupRecipient $env:BACKUP_RECIPIENT `
              -BackupIdentity $identityPath `
              -BackupPath $backupPath `
              -MinimumSchemaVersion $schemaVersion
            if ($LASTEXITCODE -ne 0) { throw 'postgres-restore-drill.ps1 failed.' }
          }
          finally {
            Remove-Item -LiteralPath $identityPath, $backupPath -Force -ErrorAction SilentlyContinue
          }
