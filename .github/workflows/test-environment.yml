name: local-test-environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-test-environment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows launcher guidance and reporting
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Exercises Windows Python diagnostics and mocked host/report paths.
      # This job does not run WSL2 or certify Docker Desktop integration.
      - name: Verify launcher behavior on Windows Python
        run: python -m unittest discover -s scripts/tests -p 'test_test_environment.py' -v

  fixture-baseline:
    name: Linux fixture baseline (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Verify the environment launcher
        run: python3 -m unittest discover -s scripts/tests -p 'test_test_environment.py' -v
      - name: Build and run the same local command
        run: python3 scripts/test-environment.py --platform '${{ matrix.platform }}'
      - name: Retain reports, skipped cases and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-fixtures-${{ matrix.artifact }}
          path: target/test-environment/
          if-no-files-found: warn
          retention-days: 14
