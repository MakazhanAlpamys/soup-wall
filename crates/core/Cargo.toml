[package]
name = "soup-wall-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Detection engine: injection/PII/secret detectors, risk scoring, policy."

[dependencies]
regex.workspace = true
serde = { workspace = true }
serde_yaml = "0.9"
unicode-normalization = "0.1"
base64 = "0.22"

# Optional ML dependencies (off by default; enabled via the `ml` feature).
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
ml = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:anyhow", "dep:serde_json"]

[dev-dependencies]
serde_json = "1"
