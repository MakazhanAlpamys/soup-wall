[workspace]
resolver = "2"
members = ["crates/core", "crates/bench", "crates/agent", "crates/agentfw", "crates/adapter"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MakazhanAlpamys/soup-wall"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
