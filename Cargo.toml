[workspace]
resolver = "2"
members = ["crates/core", "crates/proxy", "crates/bench", "crates/agent", "crates/agentfw", "crates/adapter"]
exclude = ["vendor/kryptering"]

[patch.crates-io]
kryptering = { path = "vendor/kryptering" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SoupTeam/soup-wall"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
